<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EzyAccount</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <script>window._gisLoaded=false;window.onGISLoaded=function(){window._gisLoaded=true;if(typeof _doGISInit==='function')_doGISInit();}</script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="window.onGISLoaded()"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }
    .main-logo {
      width: 200px;
      height: auto;
      margin-bottom: 12px;
    }
    .login-brand {
      font-size: 32px; font-weight: 800; color: #1a7a4a;
      margin-bottom: 4px; letter-spacing: -0.5px;
    }
    .login-brand span { color: #333; }
    .login-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 36px;
      text-align: center;
    }
    .btn-google {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 14px;
      padding: 14px 24px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      color: #111;
      width: 100%;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      transition: box-shadow .2s;
    }
    .btn-google:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .google-svg { width: 22px; height: 22px; flex-shrink: 0; }
    .kekal-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 18px; cursor: pointer;
      font-size: 14px; color: #6b7280;
    }
    .kekal-row input { width: 18px; height: 18px; accent-color: #1a7a4a; cursor: pointer; }
    .login-loading {
      display: none;
      font-size: 13px;
      color: #1a7a4a;
      margin-top: 16px;
    }

    /* ── COMPANY SCREEN ── */
    #companyScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
    }
    .user-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: #fff;
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,.08);
      margin-bottom: 24px;
    }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
    }
    .user-avatar-fallback {
      width: 36px; height: 36px; border-radius: 50%;
      background: #1a7a4a; color: #fff;
      display: none; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; flex-shrink: 0;
    }
    .user-bar-name { font-size: 14px; font-weight: 600; color: #111; }
    .user-bar-email { font-size: 11px; color: #888; }
    .user-bar-right { margin-left: auto; }
    .btn-logout {
      font-size: 12px; font-weight: 500; color: #dc2626;
      background: none; border: 1px solid #dc2626;
      border-radius: 8px; padding: 5px 10px; cursor: pointer;
    }
    .btn-logout:hover { background: #fee2e2; }
    .company-head {
      text-align: center;
      margin-bottom: 20px;
    }
    .main-logo-sm {
      width: 120px;
      height: auto;
      margin-bottom: 6px;
    }
    .company-head p { font-size: 13px; color: #666; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 14px;
      width: 100%;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px 12px 14px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      border: 2px solid transparent;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }
    /* Logo wrapper — coloured background so white logos show up */
    .card-logo-wrap {
      width: 56px; height: 56px;
      border-radius: 12px;
      margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card-logo {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .card-emoji {
      font-size: 28px;
      display: none; /* shown via JS if img fails */
    }
    .card .name {
      font-size: 13px;
      font-weight: 600;
      color: #1a3a2a;
    }
    .card .sub {
      font-size: 11px;
      color: #999;
      margin-top: 3px;
    }

    /* ── LOADING ── */
    #loadingScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #1a7a4a;
      font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #d1fae5;
      border-top-color: #1a7a4a;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 36px;
      font-size: 11px;
      color: #bbb;
    }
  </style>
</head>

// Sheet shortcut — super_admin and accountants only (they're the ones who work in the raw data).
function toggleSheetMenu(ev){
  if(ev) ev.stopPropagation();
  const m=document.getElementById('sheetMenu'); if(!m) return;
  if(m.style.display==='block'){ m.style.display='none'; return; }
  const item=(label,sub,url)=>`<a href="${url}" target="_blank" rel="noopener"
      style="display:block;padding:9px 12px;font-size:13px;color:#111827;text-decoration:none;border-bottom:1px solid #f3f4f6"
      onmouseover="this.style.background='#f9fafb'" onmouseout="this.style.background='#fff'">
      <div style="font-weight:600">${label}</div><div style="font-size:11px;color:#6b7280">${sub}</div></a>`;
  m.innerHTML=COMPANIES.filter(c=>COMPANY_SHEETS[c.id]).map(c=>item(c.name,c.sub,sheetUrl(COMPANY_SHEETS[c.id]))).join('')
    + item('👥 Registry Staff','Semua company · roles',sheetUrl(STAFF_REGISTRY_SHEET_ID));
  m.style.display='block';
}

function lsGet(k,def=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v));}

// ===== Central staff registry (EzyGroup Staff sheet) — super_admin manages here =====
const SUPER_ADMIN='keyrooll@gmail.com';
const STAFF_REGISTRY_SHEET_ID='1Ej0vKOeizIKvH0x-7cTskU8Z26MYa1xoXtIpqiL77Qg';
const GROUP_COMPANIES=[
  {id:'ezysupplier',name:'Supplier'},{id:'ezybranch',name:'Branch'},{id:'ezybakery',name:'Bakery'},
  {id:'ezycafe',name:'Cafe'},{id:'ezydurian',name:'Durian'},{id:'ezysentralkitchen',name:'Sentral Kitchen'},
  {id:'ezydurianhq',name:'Durian HQ'},{id:'ezycashier',name:'Cashier'}
];
const REGISTRY_HEADER=['Email','Nama','Gambar',...GROUP_COMPANIES.map(c=>c.id),'JoinedAt'];
const ROLE_OPTS=[['','—'],['staff','Staff'],['manager','Manager'],['accountant','Accountant']];
let _registry={header:REGISTRY_HEADER.slice(),rows:[]};

let tokenClient=null, gisReady=false, currentToken=null;

function _doGISInit(){
  gisReady=true;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:'27154479564-ufljm52nmlh4gg7ie54knphff44jvrrq.apps.googleusercontent.com',
    scope:'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive',
    callback:handleTokenResponse,
  });
  autoLogin();
}
// If GIS already loaded before this script ran, init now
if(window._gisLoaded) _doGISInit();

function doLogin(){
  if(!gisReady||!tokenClient){
    setTimeout(()=>{if(gisReady&&tokenClient)tokenClient.requestAccessToken({prompt:'select_account'});},800);
    return;
  }
  document.getElementById('loginLoading').style.display='block';
  tokenClient.requestAccessToken({prompt:'select_account'});
}

async function handleTokenResponse(resp){
  if(resp.error){document.getElementById('loginLoading').style.display='none';return;}
  currentToken=resp.access_token;
  const expiry=Date.now()+(resp.expires_in||3599)*1000;
  const kekal=document.getElementById('kekalCheck').checked;
  // Always save token — localStorage if kekal, sessionStorage if not
  if(kekal){
    lsSet('ezy_landing_token',currentToken);
    lsSet('ezy_landing_expiry',expiry);
    lsSet('ezy_kekal',true);
  } else {
    // Session only — cleared when browser closes
    sessionStorage.setItem('ezy_sess_token',currentToken);
    sessionStorage.setItem('ezy_sess_expiry',String(expiry));
  }
  showScreen('loadingScreen');
  await fetchUser();
}

async function fetchUser(){
  try{
    const r=await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{headers:{Authorization:'Bearer '+currentToken}});
    const u=await r.json();
    if(!u||!u.email)throw new Error('no email');
    lsSet('ezy_user',u);
    // Also save token to sessionStorage so app.html can pick it up even without kekal
    const expiry=Number(sessionStorage.getItem('ezy_sess_expiry')||0)||
                 lsGet('ezy_landing_expiry',0);
    sessionStorage.setItem('ezy_sess_token', currentToken);
    sessionStorage.setItem('ezy_sess_expiry', String(expiry||Date.now()+3599000));
    showCompanyScreen(u);
  }catch(e){console.error(e);showScreen('loginScreen');}
}

function autoLogin(){
  const user=lsGet('ezy_user',null);
  if(!user)return;
  // Check localStorage (kekal)
  const token1=lsGet('ezy_landing_token',null);
  const expiry1=lsGet('ezy_landing_expiry',0);
  // Check sessionStorage (session only)
  const token2=sessionStorage.getItem('ezy_sess_token');
  const expiry2=Number(sessionStorage.getItem('ezy_sess_expiry')||0);
  
  let token=null;
  if(token1&&expiry1>Date.now()) token=token1;
  else if(token2&&expiry2>Date.now()) token=token2;
  
  if(token&&user){currentToken=token;showCompanyScreen(user);}
}

// Roles this user has (from the loaded registry): {companyId: role} for non-empty roles only.
function userRolesFor(email){
  const rows=_registry.rows||[];            // rows are normalised to REGISTRY_HEADER order (Email = col 0)
  const em=(email||'').toString().trim().toLowerCase();
  const mine=rows.filter(r=>(r[0]||'').toString().trim().toLowerCase()===em);
  if(!mine.length) return {};
  // Merge across duplicate rows for the same email (a stray blank "pending" row must not shadow the
  // real one) — take the first non-empty role per company.
  const VALID=['staff','manager','accountant','super_admin'];
  const roles={};
  GROUP_COMPANIES.forEach(c=>{
    const ci=REGISTRY_HEADER.indexOf(c.id);
    for(const row of mine){
      const v=(row[ci]||'').toString().trim();
      // Only accept a real role value — this rejects a stray non-role cell (e.g. a JoinedAt date
      // that leaked into a company column through some past misalignment) instead of granting access.
      if(v && VALID.includes(v.toLowerCase())){ roles[c.id]=v; break; }
    }
  });
  return roles;
}
function _companyCard(c,role,dimmed){

    return `<div class="card" style="border-color:#e5e7eb;opacity:.45;cursor:not-allowed;filter:grayscale(1)" title="Tiada akses">
      <div class="card-logo-wrap" style="background:${c.bg}">

      </div>

    <div class="card-logo-wrap" style="background:${c.bg}">
      <img class="card-logo" src="${c.logo}" alt="${c.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">

    </div>

    <div class="sub">${role?('👤 '+role):c.sub}</div>

}
function inRegistry(email){
  const rows=_registry.rows||[];            // normalised: Email = col 0
  const em=(email||'').toString().trim().toLowerCase();
  return rows.some(r=>(r[0]||'').toString().trim().toLowerCase()===em);
}
// Auto-add a not-yet-approved user to the registry (empty roles = pending) so the admin sees them.
// Requires the registry sheet to be shared as EDITOR (Anyone with link).
async function registerPending(u){
  const row=new Array(REGISTRY_HEADER.length).fill('');
  row[0]=(u.email||'').toLowerCase(); row[1]=u.name||''; row[2]=u.picture||'';
  row[REGISTRY_HEADER.length-1]=new Date().toLocaleDateString('en-GB');
  try{
    // Ensure the Staff tab + header exist first (super_admin may not have saved yet)
    const chk=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}/values/Staff!A1:A1`,{headers:{Authorization:'Bearer '+currentToken}});
    const chkD=await chk.json();
    if(chkD.error){
      const cr=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}:batchUpdate`,{method:'POST',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'},body:JSON.stringify({requests:[{addSheet:{properties:{title:'Staff'}}}]})});
      if(!cr.ok) return cr.status===403?'need_editor':'error';
    }
    if(chkD.error||!chkD.values||!chkD.values.length){
      const hr=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}/values/Staff!A1?valueInputOption=RAW`,{method:'PUT',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'},body:JSON.stringify({values:[REGISTRY_HEADER]})});
      if(!hr.ok) return hr.status===403?'need_editor':'error';
    }
    const res=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}/values/Staff!A:Z:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{
      method:'POST',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'},body:JSON.stringify({values:[row]})
    });
    if(!res.ok){ console.warn('registerPending: append failed',res.status); return res.status===403?'need_editor':'error'; }
    _registry.rows.push(row);
    console.log('registerPending: added',u.email,'as pending');
    return 'ok';
  }catch(e){ console.warn('registerPending failed:',e); return 'error'; }
}

  return `<div style="grid-column:1/-1;background:linear-gradient(160deg,#fefce8 0%,#ecfccb 100%);border:1px solid #d9f99d;border-radius:22px;padding:44px 22px 36px;text-align:center;position:relative;overflow:hidden">

async function showCompanyScreen(u){
  document.getElementById('userPic').src=u.picture||'';
  document.getElementById('userName').textContent=u.name||'';
  document.getElementById('userEmail').textContent=u.email||'';
  const fb=document.getElementById('userPicFallback');
  fb.textContent=(u.name||u.email||'?')[0].toUpperCase();
  showScreen('companyScreen');

  const isSA=(u.email||'').toLowerCase()===SUPER_ADMIN;
  const grid=document.getElementById('companyGrid');
  const head=document.querySelector('.company-head');
  const staffBtn=document.getElementById('urusStaffBtn');
  const sheetBtn=document.getElementById('sheetBtn');
  const sheetMenu=document.getElementById('sheetMenu');
  if(sheetMenu) sheetMenu.style.display='none';
  grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#6b7280;padding:20px">⏳ Menyemak akses...</div>';
  try{ await loadRegistry(); }catch(e){ _registry={header:[],rows:[]}; }

  if(isSA){
    if(head) head.style.display='';
    if(staffBtn) staffBtn.style.display='inline-block';
    if(sheetBtn) sheetBtn.style.display='inline-block';
    grid.innerHTML=COMPANIES.map(c=>_companyCard(c,'')).join('');
    return;
  }
  if(staffBtn) staffBtn.style.display='none';
  const roles=userRolesFor(u.email);
  // Sheet shortcut is for accountants too (any company) — staff/manager don't get it.
  const isAccountant=Object.values(roles).some(r=>(r||'').toString().trim().toLowerCase()==='accountant');
  if(sheetBtn) sheetBtn.style.display=isAccountant?'inline-block':'none';
  const allowed=COMPANIES.filter(c=>roles[c.id]);
  // Only one company assigned → skip the landing, go straight in
  if(allowed.length===1){ window.location.href=allowed[0].path; return; }
  if(!allowed.length){
    if(head) head.style.display='none';
    grid.innerHTML=pendingScreenHtml(u.email);
    const stEl=document.getElementById('pendingStatus');
    if(_registry.readError){
      // Couldn't read the registry at all — do NOT auto-append (would create duplicates once the
      // read recovers). Tell the user it's a sharing problem.
      if(stEl) stEl.innerHTML='⚠️ Tak dapat baca senarai staff. Sheet registry perlu dikongsi (Viewer) dengan email anda. Minta admin.';
    } else if(inRegistry(u.email)){
      if(stEl) stEl.textContent='Permintaan anda sedang menunggu kelulusan admin.';
    } else {
      if(stEl) stEl.textContent='Merekod permintaan...';
      const st=await registerPending(u);
      if(stEl){
        if(st==='ok') stEl.innerHTML='✅ Admin telah dimaklumkan — sila tunggu kelulusan.';
        else if(st==='need_editor') stEl.innerHTML='⚠️ Sheet registry perlu dikongsi sebagai <b>Editor</b>. Minta admin.';
        else stEl.innerHTML='⚠️ Tak dapat rekod automatik — minta admin tambah email anda.';
      }
    }
    return;
  }
  if(head) head.style.display='';
  // Show every company; dim the ones the user isn't assigned to
  grid.innerHTML=COMPANIES.map(c=>_companyCard(c, roles[c.id]||'', !roles[c.id])).join('');
}

}

// ===================== STAFF MANAGER (super_admin only) =====================
function isSuperAdmin(){ const u=lsGet('ezy_user',{}); return (u.email||'').toLowerCase()===SUPER_ADMIN; }

async function loadRegistry(){
  const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}/values/Staff!A1:Z`,{headers:{Authorization:'Bearer '+currentToken}});
  const d=await r.json();
  // readError distinguishes "couldn't read the sheet" (permission/network) from "sheet is empty".
  // Only the former should stop us from auto-registering a pending row.
  if(d.error){ _registry={header:REGISTRY_HEADER.slice(),rows:[],readError:true}; return _registry; }
  if(!d.values||!d.values.length){ _registry={header:REGISTRY_HEADER.slice(),rows:[],readError:false}; return _registry; }
  // Remap every row from the sheet's OWN column order into canonical REGISTRY_HEADER order, matched
  // by header NAME. Downstream code indexes by REGISTRY_HEADER; without this, adding companies
  // (ezycashier/ezydurianhq) or any column reorder makes positional reads land on the wrong column
  // and roles look empty. After the next save the sheet is rewritten in canonical order.
  const actual=d.values[0].map(h=>(h||'').toString().trim());
  const rows=d.values.slice(1).filter(x=>x[0]).map(rr=>REGISTRY_HEADER.map(col=>{
    const i=actual.findIndex(h=>h.toLowerCase()===col.toLowerCase());
    return (i>=0 && rr[i]!==undefined) ? rr[i] : '';
  }));
  _registry={header:REGISTRY_HEADER.slice(), rows, readError:false};
  return _registry;
}
async function saveRegistry(){
  // Ensure Staff tab exists
  const chk=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}/values/Staff!A1:A1`,{headers:{Authorization:'Bearer '+currentToken}});
  if((await chk.json()).error){
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}:batchUpdate`,{method:'POST',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'},body:JSON.stringify({requests:[{addSheet:{properties:{title:'Staff'}}}]})});
  }
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}/values/Staff!A1:Z10000:clear`,{method:'POST',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'}});
  const values=[REGISTRY_HEADER, ..._registry.rows];
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}/values/Staff!A1?valueInputOption=RAW`,{method:'PUT',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'},body:JSON.stringify({values})});
}
// Column index of a company id within REGISTRY_HEADER
function colOf(companyId){ return REGISTRY_HEADER.indexOf(companyId); }

// Create the "Staff" tab + header if it doesn't exist yet (super_admin owns the sheet → always can).

  const d=await chk.json();

    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}:batchUpdate`,{method:'POST',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'},body:JSON.stringify({requests:[{addSheet:{properties:{title:'Staff'}}}]})});
  }
  if(d.error||!d.values||!d.values.length){
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${STAFF_REGISTRY_SHEET_ID}/values/Staff!A1?valueInputOption=RAW`,{method:'PUT',headers:{Authorization:'Bearer '+currentToken,'Content-Type':'application/json'},body:JSON.stringify({values:[REGISTRY_HEADER]})});
  }
}
async function openStaffManager(){
  document.getElementById('staffOverlay').style.display='flex';
  document.getElementById('staffTableWrap').innerHTML='<div style="padding:30px;text-align:center;color:#6b7280">⏳ Memuatkan...</div>';

function closeStaffManager(){ document.getElementById('staffOverlay').style.display='none'; }

function renderStaffTable(){
  const rows=_registry.rows;
  let html=`<table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr style="background:#f9fafb;position:sticky;top:0">
      <th style="padding:8px;text-align:left;border-bottom:1px solid #e5e7eb;min-width:150px">Email / Nama</th>
      ${GROUP_COMPANIES.map(c=>`<th style="padding:8px;text-align:center;border-bottom:1px solid #e5e7eb;font-size:11px">${c.name}</th>`).join('')}
      <th style="border-bottom:1px solid #e5e7eb"></th>
    </tr></thead><tbody>`;
  if(!rows.length) html+=`<tr><td colspan="${GROUP_COMPANIES.length+2}" style="padding:20px;text-align:center;color:#6b7280">Tiada staff lagi — tambah di bawah</td></tr>`;
  rows.forEach((row,i)=>{
    const hasRole=GROUP_COMPANIES.some(c=>(row[colOf(c.id)]||'').toString().trim());
    html+=`<tr style="border-bottom:1px solid #f0f0f0${hasRole?'':';background:#fffbeb'}">
      <td style="padding:6px 8px"><div style="font-weight:600">${(row[0]||'').replace(/</g,'&lt;')} ${hasRole?'':'<span style="font-size:10px;color:#d97706;font-weight:600">⏳ pending</span>'}</div><div style="color:#6b7280;font-size:11px">${(row[1]||'').replace(/</g,'&lt;')}</div></td>
      ${GROUP_COMPANIES.map(c=>{const ci=colOf(c.id);const val=(row[ci]||'').toLowerCase();return `<td style="padding:4px;text-align:center"><select onchange="updateCell(${i},'${c.id}',this.value)" style="font-size:11px;padding:3px;border:1px solid #e5e7eb;border-radius:5px">${ROLE_OPTS.map(o=>`<option value="${o[0]}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></td>`;}).join('')}
      <td style="padding:4px;text-align:center"><button onclick="removeStaff(${i})" style="background:none;border:none;color:#dc2626;cursor:pointer;font-size:14px">✕</button></td>
    </tr>`;
  });
  html+=`</tbody></table>`;
  document.getElementById('staffTableWrap').innerHTML=html;
}
function updateCell(rowIdx, companyId, role){
  const ci=colOf(companyId);
  while(_registry.rows[rowIdx].length<=ci) _registry.rows[rowIdx].push('');
  _registry.rows[rowIdx][ci]=role;
}
function removeStaff(rowIdx){
  if(!confirm('Buang staff ini dari registry?')) return;
  _registry.rows.splice(rowIdx,1);
  renderStaffTable();
}
function addStaffRow(){
  const email=(document.getElementById('newStaffEmail').value||'').trim().toLowerCase();
  const name=(document.getElementById('newStaffName').value||'').trim();
  if(!email||!email.includes('@')){ alert('Sila masukkan email yang sah'); return; }
  if(_registry.rows.some(r=>(r[0]||'').toLowerCase()===email)){ alert('Email ni dah ada dalam senarai'); return; }
  const row=new Array(REGISTRY_HEADER.length).fill('');
  row[0]=email; row[1]=name; row[REGISTRY_HEADER.length-1]=new Date().toLocaleDateString('en-GB');
  _registry.rows.push(row);
  document.getElementById('newStaffEmail').value='';
  document.getElementById('newStaffName').value='';
  renderStaffTable();
}
async function saveStaffRegistry(){
  const btn=document.getElementById('btnSaveRegistry');
  btn.disabled=true; btn.textContent='Menyimpan...';
  try{ await saveRegistry(); btn.textContent='✅ Disimpan'; setTimeout(()=>{btn.textContent='Simpan Semua';btn.disabled=false;},1500); }
  catch(e){ alert('Gagal simpan: '+e.message); btn.textContent='Simpan Semua'; btn.disabled=false; }
}

function showScreen(id){
  ['loginScreen','loadingScreen','companyScreen'].forEach(s=>{
    document.getElementById(s).style.display=(s===id)?'flex':'none';
  });
}
